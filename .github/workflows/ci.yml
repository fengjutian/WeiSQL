name: CI

# Behaviour gates. The browser job runs the Chromium probes on the runner's
# preinstalled Chrome (no download); the benchmark harness stays local because
# its fixture generation needs Python and a stable machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run embed:wasm:check
      - run: npm run release:check
      - run: npm run release:pack
      - run: npm run bench:self-test

      # The committed golden fixture must still be exactly what the TypeScript
      # exact search produces; the Rust job asserts the other half of the pair.
      - name: TypeScript ↔ Rust golden fixture
        run: npm run test:rust-golden

      # Browser-free half of the bundled-WASM probe: real HTTP fetch of the two
      # packaged artifacts, Range reads, and three adapters on the example package.
      - name: Bundled WASM vector scenario
        run: npm run test:wasm-vector-scenario

      # The evaluation harness itself: uses the packaged HNSW artifact, so a
      # broken tool or a regression below the recall floor fails without Rust.
      - name: HNSW dataset benchmark smoke
        run: npm run test:hnsw-dataset

      # Same contract on both operating systems: the blockers here are the WASM
      # extension download and native DuckDB bindings, not the SQL text.
      - name: SQL adapter contract
        run: npm run test:contract
      - name: Validate the example package
        run: node packages/cli/dist/bin.js validate examples/fixture

      - name: Inspect the example package
        run: node packages/cli/dist/bin.js inspect examples/fixture

      - name: Validate the example package including L4
        run: node packages/cli/dist/bin.js validate examples/fixture --l4

  rust:
    name: rust vector baseline and wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # The baseline is the correctness oracle for every ANN comparison, so it
      # gets the same gates as the TypeScript packages instead of relying on
      # contributors to remember `cargo test`.
      - name: Formatting
        run: |
          cargo fmt --check --manifest-path crates/vector-benchmark/Cargo.toml
          cargo fmt --check --manifest-path crates/vector-wasm/Cargo.toml
          cargo fmt --check --manifest-path crates/vector-hnsw/Cargo.toml
          cargo fmt --check --manifest-path crates/vector-hnsw-wasm/Cargo.toml
      - name: Lints
        run: |
          cargo clippy --locked --manifest-path crates/vector-benchmark/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path crates/vector-wasm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path crates/vector-hnsw/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path crates/vector-hnsw-wasm/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: |
          cargo test --locked --manifest-path crates/vector-benchmark/Cargo.toml
          cargo test --locked --manifest-path crates/vector-wasm/Cargo.toml
          cargo test --locked --manifest-path crates/vector-hnsw/Cargo.toml
          cargo test --locked --manifest-path crates/vector-hnsw-wasm/Cargo.toml
      - name: Benchmark smoke
        run: cargo run --locked --release --manifest-path crates/vector-benchmark/Cargo.toml -- 10000 128 10 2
      - name: HNSW recall smoke
        run: cargo run --locked --release --quiet --manifest-path crates/vector-hnsw/Cargo.toml --example recall

      # Same golden fixture, third implementation: the artifact that ships to
      # the browser must rank identically to TypeScript and to native Rust.
      - name: Build the WASM baseline
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path crates/vector-wasm/Cargo.toml
      - name: WASM golden parity
        run: node tools/bench/wasm-baseline.mjs

      # The fallback ANN engine also runs in WASM, so its graph is built and
      # searched by the module that would ship to a browser.
      - name: Build the HNSW WASM module
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path crates/vector-hnsw-wasm/Cargo.toml
      - name: HNSW WASM recall
        run: node tools/bench/hnsw-wasm.mjs

      # The adapter is the SDK-facing half: build the package and run it against
      # the TypeScript exact adapter on the same in-memory collection.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @weisql/sdk
      - name: WASM adapter parity
        run: node tools/bench/wasm-adapter.mjs
      - name: HNSW adapter parity
        run: node tools/bench/hnsw-adapter.mjs
      - name: HNSW package index
        run: node tools/bench/hnsw-package.mjs

  derived:
    name: derived indexes and fixture determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Smoke the DuckDB-Wasm materialization path: it downloads the parquet
      # extension once and materializes 1k rows, so broken adapter/extension
      # wiring fails here instead of only in the local browser probes.
      - name: DuckDB-Wasm materialization smoke
        run: node --expose-gc tools/bench/wasm.mjs --smoke

      # One SQL contract, both real adapters. Declared differences live in
      # tools/sql-contract/cases.mjs; anything else fails here.
      - name: SQL adapter contract
        run: node tools/sql-contract/run.mjs

      # The committed fixture must be reproducible byte-for-byte; otherwise the
      # digests in the Manifest prove nothing about the generator.
      - name: Rebuild the fixture
        run: npm run fixture
      - name: Fixture must not change
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain -- examples/fixture
          test -z "$(git status --porcelain -- examples/fixture)"

      - name: Build derived indexes and validate the result
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/pkg"
          rm -rf "$package"
          cp -R examples/fixture "$package"
          node tools/build-text-index.mjs "$package" --table documents --column title
          node tools/build-ann-index.mjs "$package"
          node packages/cli/dist/bin.js validate "$package"

      - name: Pack the package and validate the container
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js pack examples/fixture --output "$RUNNER_TEMP/pkg.wsql"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/pkg.wsql"

      - name: Unpack the container and validate the extracted directory
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js unpack "$RUNNER_TEMP/pkg.wsql" --output "$RUNNER_TEMP/unpacked"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/unpacked"

      - name: Sign the fixture, verify it and validate with the signature
        shell: bash
        run: |
          set -euo pipefail
          cp -R examples/fixture "$RUNNER_TEMP/signed"
          node packages/cli/dist/bin.js keygen --output "$RUNNER_TEMP/key"
          node packages/cli/dist/bin.js sign "$RUNNER_TEMP/signed" --key "$RUNNER_TEMP/key.key.pem"
          node packages/cli/dist/bin.js verify-signature "$RUNNER_TEMP/signed"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/signed" --signature

      - name: Pack a compressed container, validate and unpack it
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js pack examples/fixture --compress --output "$RUNNER_TEMP/pkg-gzip.wsql"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/pkg-gzip.wsql"
          node packages/cli/dist/bin.js unpack "$RUNNER_TEMP/pkg-gzip.wsql" --output "$RUNNER_TEMP/unpacked-gzip"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/unpacked-gzip"

  browser:
    name: browser probes (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The runner image ships Google Chrome at /usr/bin/google-chrome, which is
      # exactly what the probes look for; no browser download is needed.
      - name: Verify the browser is available
        run: google-chrome --version

      # The docs promise that the documented lifecycle works in a real bundler.
      # These build the runnable examples and assert READY + hits + Range reads.
      - name: Install framework example dependencies
        run: |
          npm ci --prefix examples/frameworks/vite-react
          npm ci --prefix examples/frameworks/sveltekit

      - name: Framework lifecycle smoke (Vite + React, SvelteKit)
        run: npm run test:frameworks

      - name: SDK browser probe (Range, L3, exact search, cache)
        run: npm run probe:browser

      - name: Bundled WASM vector probe (exact + HNSW)
        run: npm run probe:wasm-vector

      - name: DuckDB-Wasm browser SQL probe
        run: npm run probe:wasm

      - name: Cross-tab OPFS lock probe
        run: npm run probe:opfs-lock

      - name: Playground probe (SQL, text, RAG, containers)
        run: npm run probe:playground

      - name: Node ↔ Chromium parity
        run: npm run probe:parity
