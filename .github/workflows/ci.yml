name: CI

# Behaviour gates. The browser job runs the Chromium probes on the runner's
# preinstalled Chrome (no download); the benchmark harness stays local because
# its fixture generation needs Python and a stable machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:check
      - run: npm run release:pack
      - run: npm run bench:self-test

      # Same contract on both operating systems: the blockers here are the WASM
      # extension download and native DuckDB bindings, not the SQL text.
      - name: SQL adapter contract
        run: npm run test:contract
      - name: Validate the example package
        run: node packages/cli/dist/bin.js validate examples/fixture

      - name: Inspect the example package
        run: node packages/cli/dist/bin.js inspect examples/fixture

      - name: Validate the example package including L4
        run: node packages/cli/dist/bin.js validate examples/fixture --l4

  derived:
    name: derived indexes and fixture determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # Smoke the DuckDB-Wasm materialization path: it downloads the parquet
      # extension once and materializes 1k rows, so broken adapter/extension
      # wiring fails here instead of only in the local browser probes.
      - name: DuckDB-Wasm materialization smoke
        run: node --expose-gc tools/bench/wasm.mjs --smoke

      # One SQL contract, both real adapters. Declared differences live in
      # tools/sql-contract/cases.mjs; anything else fails here.
      - name: SQL adapter contract
        run: node tools/sql-contract/run.mjs

      # The committed fixture must be reproducible byte-for-byte; otherwise the
      # digests in the Manifest prove nothing about the generator.
      - name: Rebuild the fixture
        run: npm run fixture
      - name: Fixture must not change
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain -- examples/fixture
          test -z "$(git status --porcelain -- examples/fixture)"

      - name: Build derived indexes and validate the result
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/pkg"
          rm -rf "$package"
          cp -R examples/fixture "$package"
          node tools/build-text-index.mjs "$package" --table documents --column title
          node tools/build-ann-index.mjs "$package"
          node packages/cli/dist/bin.js validate "$package"

      - name: Pack the package and validate the container
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js pack examples/fixture --output "$RUNNER_TEMP/pkg.wsql"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/pkg.wsql"

      - name: Unpack the container and validate the extracted directory
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js unpack "$RUNNER_TEMP/pkg.wsql" --output "$RUNNER_TEMP/unpacked"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/unpacked"

      - name: Sign the fixture, verify it and validate with the signature
        shell: bash
        run: |
          set -euo pipefail
          cp -R examples/fixture "$RUNNER_TEMP/signed"
          node packages/cli/dist/bin.js keygen --output "$RUNNER_TEMP/key"
          node packages/cli/dist/bin.js sign "$RUNNER_TEMP/signed" --key "$RUNNER_TEMP/key.key.pem"
          node packages/cli/dist/bin.js verify-signature "$RUNNER_TEMP/signed"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/signed" --signature

      - name: Pack a compressed container, validate and unpack it
        shell: bash
        run: |
          set -euo pipefail
          node packages/cli/dist/bin.js pack examples/fixture --compress --output "$RUNNER_TEMP/pkg-gzip.wsql"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/pkg-gzip.wsql"
          node packages/cli/dist/bin.js unpack "$RUNNER_TEMP/pkg-gzip.wsql" --output "$RUNNER_TEMP/unpacked-gzip"
          node packages/cli/dist/bin.js validate "$RUNNER_TEMP/unpacked-gzip"

  browser:
    name: browser probes (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      # The runner image ships Google Chrome at /usr/bin/google-chrome, which is
      # exactly what the probes look for; no browser download is needed.
      - name: Verify the browser is available
        run: google-chrome --version

      - name: SDK browser probe (Range, L3, exact search, cache)
        run: npm run probe:browser

      - name: DuckDB-Wasm browser SQL probe
        run: npm run probe:wasm

      - name: Playground probe (SQL, text, RAG, containers)
        run: npm run probe:playground

      - name: Node ↔ Chromium parity
        run: npm run probe:parity
