name: Docs

# Builds the Docusaurus site in website/ independently from the SDK matrix.
# The site has its own lockfile, so this job never installs DuckDB / USearch.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "netlify.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "netlify.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # showLastUpdateTime needs history; a shallow clone would drop it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install site dependencies
        working-directory: website
        run: npm ci
      - name: Check example snippets
        working-directory: website
        run: npm run check:snippets
      - name: Build site
        working-directory: website
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: website/build
          retention-days: 7
