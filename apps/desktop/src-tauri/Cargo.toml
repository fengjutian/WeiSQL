[package]
name = "weisql-desktop"
version = "0.1.0"
description = "WeiSQL Desktop — a Tauri client for WeiSQL data packages"
authors = ["WeiSQL AI"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "weisql_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
