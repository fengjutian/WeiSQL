[package]
name = "weisql-vector-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "WASM ABI for the WeiSQL exact cosine baseline"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
weisql-vector-benchmark = { path = "../vector-benchmark" }

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
