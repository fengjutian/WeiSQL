# Netlify configuration for the documentation site.
# The site lives in website/ and is intentionally independent from the root
# npm workspaces so DuckDB / USearch native bindings never enter this build.
[build]
  base = "website"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Docusaurus emits content-hashed assets under /assets/.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Search index changes on every content edit; never serve a stale copy.
[[headers]]
  for = "/*search-index*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Docusaurus generates 404.html; Netlify serves it automatically.
